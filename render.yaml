services:
  - type: web
    name: teacher-knowledge-package-pipeline
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false  # set manually in the Render dashboard, never commit it
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
    healthCheckPath: /api/health
